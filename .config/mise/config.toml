[tasks."config:zsh"]
description = "Config zshrc with sheldon"
shell = "bash -c"
run = """
set -euo pipefail

if [[ "${SHELL:-}" != */zsh ]]; then
  echo "config:zsh must be run in a zsh environment (SHELL=${SHELL:-unset})." >&2
  exit 1
fi

if ! command -v sheldon >/dev/null 2>&1; then
  echo "sheldon is not available in PATH. Install it first (e.g. via mise install)." >&2
  exit 1
fi

ZSHRC="$HOME/.zshrc"
SHELDON_SNIPPET='eval "$(sheldon source)"'

# Avoid noisy grep errors on a fresh machine.
[ -e "$ZSHRC" ] || touch "$ZSHRC"

if ! grep -qxF "$SHELDON_SNIPPET" "$ZSHRC"; then
  # Add a separator newline only when the file already has content.
  if [ -s "$ZSHRC" ]; then
    printf '\n' >> "$ZSHRC"
  fi
  printf '%s\n' "$SHELDON_SNIPPET" >> "$ZSHRC"
  echo "Added sheldon snippet to $ZSHRC"
else
  echo "sheldon snippet already exists in $ZSHRC"
fi
"""
