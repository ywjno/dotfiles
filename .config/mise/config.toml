[tasks."config:zsh"]
description = "Config zshrc with sheldon and plugins"
shell = "bash -c"
run = """
set -euo pipefail

# 1) sheldon should be provided by mise tools
if ! command -v sheldon >/dev/null 2>&1; then
  echo "sheldon is not available in PATH. Run: mise install" >&2
  exit 1
fi
sheldon init --shell zsh

# 2) ensure zshrc snippet exists only once
ZSHRC="$HOME/.zshrc"
SHELDON_SNIPPET='eval "$(sheldon source)"'
if ! grep -qxF "$SHELDON_SNIPPET" "$ZSHRC"; then
  printf '\n%s\n' "$SHELDON_SNIPPET" >> "$ZSHRC"
fi
"""
